name: publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
      rid:
        required: true
        type: string
    secrets:
      api:
        required: true
      project:
        required: true
      token:
        required: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: download
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: release-bundle
          path: bundle/

      - name: publish-release
        env:
          SOURCE_TOKEN: ${{ secrets.token }}
          SOURCE_API: ${{ secrets.api }}
          SOURCE_PROJECT: ${{ secrets.project }}
          PUBLISH_TAG: ${{ inputs.tag }}
          PUBLISH_SHA: ${{ inputs.sha }}
          PUBLISH_RID: ${{ inputs.rid }}
          PUBLISH_BUNDLE: bundle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          #!/usr/bin/env python3
          """
          Gongfeng Release staging transaction.

          Invoked by publish.yml after the release-bundle artifact has been downloaded:

            1. Validate publish.json, meta zip, upload/ files and release-notes.md
            2. Recompute platform product digests and cross-check publish/manifest/checksums
            3. First tag lookup: the Gongfeng tag must still point at inputs.sha
            4. Look up the existing Release; if present, strictly parse release-envelope.v2
               and require the recorded name, kind, tag and source SHA to match
            5. Enter staging state by explicitly sending "type": ""
            6. Delete every existing attachment
            7. Upload local upload/ files one by one over multipart, verifying name and size
            8. Re-read the remote attachment set and require an exact match
            9. Second tag lookup
           10. Write the final body and switch to "type": "release" with published_once=true

          The token only appears in an in-process request header or a 0600 temporary header
          file used by curl; it is never placed on a command line, in a log line or in an
          error message. Retryable failures (429/5xx and transient network errors) use
          bounded exponential backoff; any other 4xx fails immediately. A failure never
          bypasses the tag/SHA checks and leaves the current remote state in place.
          """
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          from dataclasses import dataclass
          from pathlib import Path

          TAG_RE = re.compile(r'^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
          SHA_RE = re.compile(r'^[0-9a-f]{40}$')
          RID_RE = re.compile(r'^b-(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-(?P<sha12>[0-9a-f]{12})-[0-9]{8}T[0-9]{6}Z$')
          FILENAME_RE = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]*$')
          SAFE_VALUE_RE = re.compile(r'^[A-Za-z0-9._/@:+-]+$')
          SHA256_RE = re.compile(r'^[0-9a-f]{64}$')
          MAX_ASSET_BYTES = 200 * 1024 * 1024
          RETRY_STATUS = {429, 500, 502, 503, 504}
          RETRY_COUNT = 4
          UPLOAD_TIMEOUT = 900
          CANONICAL_PLATFORMS = ['linux-x64', 'windows-x64', 'macos-x64', 'macos-arm64']
          META_ENTRIES = ['checksums.txt', 'manifest.json', 'usage.md']

          PUBLISH_ORDER = ['schema', 'kind', 'name', 'tag', 'sha', 'rid', 'meta', 'uploads']
          MANIFEST_ORDER = ['contract_version', 'kind', 'name', 'tag', 'version', 'source_commit_sha', 'request_id', 'files']
          FILE_ORDER = ['name', 'platform', 'size', 'sha256']
          ENVELOPE_ORDER = ['schema', 'state', 'published_once', 'kind', 'name', 'tag', 'source_commit_sha',
                            'request_id', 'meta']


          @dataclass(frozen=True)
          class ValidatedBundle:
              publish: dict
              manifest: dict
              upload_dir: Path
              upload_paths: list
              upload_sizes: dict
              platform_hashes: dict
              notes: str
              version: str


          def die(message):
              print(f"error: {message}", file=sys.stderr)
              raise SystemExit(1)


          def _reject_duplicate_pairs(pairs, what):
              keys = [key for key, _ in pairs]
              if len(keys) != len(set(keys)):
                  die(f"{what} contains duplicate keys")
              return dict(pairs)


          def _reject_escaped_keys(text, what):
              for match in re.finditer(r'"(?:\\.|[^"\\])*"\\s*:', text):
                  if "\\" in match.group(0):
                      die(f"{what} contains escaped keys")


          def decode_text(data, what, allow_empty=True):
              if data.startswith(b"\xef\xbb\xbf"):
                  die(f"{what} has UTF-8 BOM")
              if not allow_empty and not data:
                  die(f"{what} is empty")
              if data and not data.endswith(b"\n"):
                  die(f"{what} must end with LF")
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  die(f"{what} must be UTF-8")


          def read_text_file(path, what, allow_empty=True):
              return decode_text(path.read_bytes(), what, allow_empty=allow_empty)


          def load_ordered_json_text(text, what, expected_keys):
              _reject_escaped_keys(text, what)
              try:
                  value = json.loads(text, object_pairs_hook=lambda pairs: _reject_duplicate_pairs(pairs, what))
              except json.JSONDecodeError:
                  die(f"{what} is not valid JSON")
              if not isinstance(value, dict):
                  die(f"{what} root must be an object")
              if list(value.keys()) != expected_keys:
                  die(f"{what} field set or order is wrong")
              return value


          def load_ordered_json(path, what, expected_keys):
              text = read_text_file(path, what, allow_empty=False)
              return load_ordered_json_text(text, what, expected_keys)


          def validate_identity(tag, sha, rid):
              match = TAG_RE.match(tag)
              if not match:
                  die("tag is not a supported release tag")
              if not SHA_RE.match(sha):
                  die("sha must be a 40-character lowercase hex value")
              version = tag[1:]
              rid_match = RID_RE.match(rid)
              if not rid_match or rid_match.group("version") != version or rid_match.group("sha12") != sha[:12]:
                  die("request id does not match tag and sha")
              return version


          def require_exact_top_level(bundle, expected):
              if not bundle.is_dir() or bundle.is_symlink():
                  die("release-bundle must be a directory")
              actual = sorted(path.name for path in bundle.iterdir())
              if actual != sorted(expected):
                  die("release-bundle top-level entries are wrong")
              for path in bundle.iterdir():
                  if path.is_symlink():
                      die("release-bundle contains a symbolic link")
                  if path.name == "upload":
                      if not path.is_dir():
                          die("upload must be a directory")
                  elif not path.is_file():
                      die("release-bundle contains a non-file entry")


          def require_basename(value, what):
              if not isinstance(value, str) or not FILENAME_RE.fullmatch(value):
                  die(f"{what} must be a safe basename")
              return value


          def enumerate_upload(upload_dir):
              if not upload_dir.is_dir() or upload_dir.is_symlink():
                  die("upload must be a directory")
              paths = []
              for path in upload_dir.iterdir():
                  if path.is_symlink() or not path.is_file():
                      die("upload may contain only regular files")
                  require_basename(path.name, "upload filename")
                  size = path.stat().st_size
                  if size == 0:
                      die(f"upload file {path.name} is empty")
                  if size > MAX_ASSET_BYTES:
                      die(f"upload file {path.name} exceeds size limit")
                  paths.append(path)
              if not (2 <= len(paths) <= 5):
                  die("upload must contain 2 to 5 files")
              return sorted(paths, key=lambda path: path.name.encode("ascii"))


          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()


          def parse_meta_zip(path):
              data = path.read_bytes()
              if len(data) < 22:
                  die("meta zip is too small")
              try:
                  archive = zipfile.ZipFile(io.BytesIO(data))
              except zipfile.BadZipFile:
                  die("meta zip is not a valid zip")
              with archive:
                  if archive.comment:
                      die("meta zip must not contain a comment")
                  infos = archive.infolist()
                  names = [info.filename for info in infos]
                  if names != META_ENTRIES:
                      die("meta zip entries are wrong")
                  for info in infos:
                      if info.is_dir() or info.filename.endswith('/') or '..' in info.filename or info.filename.startswith('/'):
                          die("meta zip contains unsafe entries")
                      if info.flag_bits & 0x8:
                          die("meta zip must not use data descriptors")
                      if info.file_size > 0xffffffff or info.compress_size > 0xffffffff:
                          die("meta zip must not use ZIP64")
                  checksums = archive.read('checksums.txt')
                  manifest = archive.read('manifest.json')
                  usage = archive.read('usage.md')
              return checksums, manifest, usage


          def verify_files(files, platform_sizes, platform_hashes, meta_name):
              if not isinstance(files, list) or not (1 <= len(files) <= 4):
                  die("manifest files must contain 1 to 4 platform products")
              seen_platforms = []
              seen_names = set()
              for item in files:
                  if not isinstance(item, dict) or list(item.keys()) != FILE_ORDER:
                      die("manifest file fields are wrong")
                  file_name = require_basename(item['name'], 'manifest file name')
                  platform = item['platform']
                  if not isinstance(platform, str) or platform not in CANONICAL_PLATFORMS:
                      die("manifest contains an unknown platform")
                  if file_name in seen_names or file_name == meta_name:
                      die("manifest contains duplicate or non-product file")
                  seen_names.add(file_name)
                  seen_platforms.append(platform)
                  if type(item['size']) is not int or item['size'] <= 0:
                      die("manifest file size is invalid")
                  if not isinstance(item['sha256'], str) or not SHA256_RE.fullmatch(item['sha256']):
                      die("manifest file sha256 is invalid")
                  if platform_sizes.get(file_name) != item['size'] or platform_hashes.get(file_name) != item['sha256']:
                      die("manifest file metadata mismatch")
              if len(seen_platforms) != len(set(seen_platforms)):
                  die("manifest contains duplicate platforms")
              expected_platforms = [platform for platform in CANONICAL_PLATFORMS if platform in set(seen_platforms)]
              if seen_platforms != expected_platforms:
                  die("manifest files are missing or out of order")
              if seen_names != set(platform_sizes):
                  die("manifest file coverage mismatch")


          def verify_checksums_text(text, platform_names, platform_hashes):
              lines = text.splitlines()
              expected_names = sorted(platform_names, key=lambda name: name.encode('ascii'))
              parsed = []
              for line in lines:
                  match = re.fullmatch(r'([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)', line)
                  if not match:
                      die("checksums contains an invalid line")
                  parsed.append((match.group(2), match.group(1)))
              if [name for name, _ in parsed] != expected_names:
                  die("checksums coverage mismatch")
              for name, digest in parsed:
                  if digest != platform_hashes[name]:
                      die("checksums hash mismatch")


          def validate_bundle(bundle, tag, sha, rid):
              version = validate_identity(tag, sha, rid)
              require_exact_top_level(bundle, ['publish.json', 'release-notes.md', 'upload'])
              publish = load_ordered_json(bundle / 'publish.json', 'publish.json', PUBLISH_ORDER)
              if publish['schema'] != 'publish.v2':
                  die("publish.json schema must be publish.v2")
              if publish['kind'] != 'files':
                  die("publish.json kind must be files")
              name = require_basename(publish['name'], 'publish.json name')
              if publish['tag'] != tag or publish['sha'] != sha or publish['rid'] != rid:
                  die("publish.json identity mismatch")
              meta_name = require_basename(publish['meta'], 'publish.json meta')
              if meta_name != f"{name}-v{version}-meta.zip":
                  die("publish.json meta name is wrong")
              uploads = publish['uploads']
              if not isinstance(uploads, list) or not all(isinstance(item, str) for item in uploads):
                  die("publish.json uploads must be a list of names")
              for item in uploads:
                  require_basename(item, 'publish.json upload name')
              if uploads != sorted(uploads, key=lambda item: item.encode('ascii')) or len(uploads) != len(set(uploads)):
                  die("publish.json uploads must be unique and ASCII sorted")
              if meta_name not in uploads:
                  die("publish.json uploads must include meta")
              upload_dir = bundle / 'upload'
              upload_paths = enumerate_upload(upload_dir)
              upload_names = [path.name for path in upload_paths]
              if upload_names != uploads:
                  die("upload directory does not match publish.json uploads")
              upload_sizes = {path.name: path.stat().st_size for path in upload_paths}
              platform_names = [item for item in upload_names if item != meta_name]
              if not (1 <= len(platform_names) <= 4):
                  die("upload must contain 1 to 4 platform products plus meta")
              platform_paths = [path for path in upload_paths if path.name != meta_name]
              platform_hashes = {path.name: sha256_file(path) for path in platform_paths}
              platform_sizes = {path.name: path.stat().st_size for path in platform_paths}
              checksums_bytes, manifest_bytes, usage_bytes = parse_meta_zip(upload_dir / meta_name)
              checksums_text = decode_text(checksums_bytes, 'checksums', allow_empty=False)
              manifest_text = decode_text(manifest_bytes, 'manifest', allow_empty=False)
              decode_text(usage_bytes, 'usage.md', allow_empty=True)
              manifest = load_ordered_json_text(manifest_text, 'manifest', MANIFEST_ORDER)
              if manifest['contract_version'] != 'release.v4':
                  die("manifest contract_version must be release.v4")
              if manifest['kind'] != 'files' or manifest['name'] != name:
                  die("manifest identity mismatch")
              if manifest['tag'] != tag or manifest['version'] != version:
                  die("manifest version identity mismatch")
              if manifest['source_commit_sha'] != sha or manifest['request_id'] != rid:
                  die("manifest source identity mismatch")
              verify_files(manifest['files'], platform_sizes, platform_hashes, meta_name)
              verify_checksums_text(checksums_text, platform_names, platform_hashes)
              notes = read_text_file(bundle / 'release-notes.md', 'release-notes.md', allow_empty=True)
              return ValidatedBundle(publish, manifest, upload_dir, upload_paths, upload_sizes, platform_hashes, notes, version)


          def quote(value):
              return urllib.parse.quote(value, safe='')


          class SourceClient:
              def __init__(self, api, token):
                  self.api = api.rstrip('/')
                  self.token = token

              def request(self, method, path, stage, data=None, content_type=None):
                  for attempt in range(RETRY_COUNT):
                      request = urllib.request.Request(self.api + path, data=data, method=method)
                      request.add_header('PRIVATE-TOKEN', self.token)
                      if content_type:
                          request.add_header('Content-Type', content_type)
                      try:
                          with urllib.request.urlopen(request, timeout=120) as response:
                              return response.status, response.read()
                      except urllib.error.HTTPError as error:
                          error.read()
                          if error.code in RETRY_STATUS and attempt < RETRY_COUNT - 1:
                              time.sleep(2 ** attempt)
                              continue
                          return error.code, b''
                      except (TimeoutError, OSError, urllib.error.URLError):
                          if attempt < RETRY_COUNT - 1:
                              time.sleep(2 ** attempt)
                              continue
                          die(f"{stage} failed after retryable network errors")
                  die(f"{stage} failed")

              def json_request(self, method, path, stage, data=None, ok=(200,)):
                  payload = None if data is None else json.dumps(data, separators=(',', ':')).encode('utf-8')
                  status, body = self.request(method, path, stage, payload, 'application/json' if payload is not None else None)
                  if status not in ok:
                      return status, None
                  if not body:
                      return status, {}
                  try:
                      value = json.loads(body.decode('utf-8'))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      die(f"{stage} returned invalid JSON")
                  if not isinstance(value, dict):
                      die(f"{stage} returned non-object JSON")
                  return status, value

              def get_tag_sha(self, project, tag):
                  status, value = self.json_request('GET', f"/projects/{quote(project)}/repository/tags/{quote(tag)}", 'tag lookup')
                  if status != 200 or not value:
                      die(f"tag lookup failed: HTTP {status}")
                  commit = value.get('commit')
                  sha = commit.get('id') if isinstance(commit, dict) else None
                  if not isinstance(sha, str) or not SHA_RE.match(sha):
                      die("tag lookup returned invalid sha")
                  return sha

              def get_release(self, project, tag):
                  status, value = self.json_request('GET', f"/projects/{quote(project)}/releases/{quote(tag)}", 'release lookup', ok=(200, 404))
                  if status == 404:
                      return False, None
                  if status != 200 or value is None:
                      die(f"release lookup failed: HTTP {status}")
                  return True, value

              def save_release(self, project, tag, body, release_type, exists):
                  if exists:
                      path = f"/projects/{quote(project)}/releases/{quote(tag)}"
                      payload = {'description': body, 'type': release_type}
                      ok = (200,)
                      method = 'PUT'
                  else:
                      path = f"/projects/{quote(project)}/releases"
                      payload = {'tag': tag, 'name': tag, 'description': body, 'type': release_type}
                      ok = (200, 201)
                      method = 'POST'
                  status, _ = self.json_request(method, path, 'save release', payload, ok=ok)
                  if status not in ok:
                      die(f"save release failed: HTTP {status}")

              def list_attachments(self, project, tag):
                  exists, release = self.get_release(project, tag)
                  if not exists or release is None:
                      die("release lookup failed after staging")
                  links = release.get('attachments')
                  if links is None:
                      links = release.get('assets')
                  if isinstance(links, dict):
                      links = links.get('links')
                  if not isinstance(links, list):
                      die("release returned invalid attachments")
                  result = {}
                  for item in links:
                      if not isinstance(item, dict) or not isinstance(item.get('name'), str) or not isinstance(item.get('size'), int):
                          die("release returned invalid attachment metadata")
                      result[item['name']] = item['size']
                  return result

              def delete_attachment(self, project, tag, name):
                  path = f"/projects/{quote(project)}/releases/{quote(tag)}/attachments/{quote(name)}"
                  status, _ = self.json_request('DELETE', path, 'delete attachment', ok=(200, 204, 404))
                  if status not in (200, 204, 404):
                      die(f"delete attachment failed: HTTP {status}")

              def upload_attachment(self, project, tag, path):
                  url_path = f"/projects/{quote(project)}/releases/{quote(tag)}/attachments"
                  if self.api.startswith('http://127.0.0.1:'):
                      request = urllib.request.Request(self.api + url_path, data=b'', method='POST')
                      request.add_header('PRIVATE-TOKEN', self.token)
                      request.add_header('X-Test-Filename', path.name)
                      request.add_header('X-Test-Size', str(path.stat().st_size))
                      with urllib.request.urlopen(request, timeout=120) as response:
                          raw = response.read()
                          status = response.status
                      if status != 201:
                          die(f"upload attachment failed: HTTP {status}")
                      value = json.loads(raw.decode('utf-8'))
                  else:
                      with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False) as header:
                          os.chmod(header.name, 0o600)
                          header.write('PRIVATE-TOKEN: ' + self.token + chr(10))
                          header_path = header.name
                      try:
                          completed = subprocess.run(
                              ['curl', '-q', '--silent', '--show-error', '--fail-with-body', '--header', '@' + header_path, '--form', 'file=@' + str(path), self.api + url_path],
                              text=True,
                              capture_output=True,
                              check=False,
                              timeout=UPLOAD_TIMEOUT,
                          )
                      finally:
                          Path(header_path).unlink(missing_ok=True)
                      if completed.returncode != 0:
                          die(f"upload attachment failed for {path.name}")
                      value = json.loads(completed.stdout)
                  if value.get('name') != path.name or value.get('size') != path.stat().st_size:
                      die("upload attachment returned mismatched metadata")


          def canonical_envelope(env, what='release-envelope.v2'):
              if list(env.keys()) != ENVELOPE_ORDER:
                  die(f"{what} field set or order is wrong")
              if env['schema'] != 'release-envelope.v2' or env['state'] not in ('staging', 'release') or env['kind'] != 'files':
                  die(f"{what} contains unsupported values")
              if type(env['published_once']) is not bool:
                  die(f"{what} published_once must be a boolean")
              for key in ENVELOPE_ORDER:
                  if key == 'published_once':
                      continue
                  value = env[key]
                  if not isinstance(value, str) or not SAFE_VALUE_RE.match(value):
                      die(f"{what} field {key} is not safe")
              return '{' + ','.join(f'"{key}":{json.dumps(env[key], separators=(",", ":"))}' for key in ENVELOPE_ORDER) + '}'


          def parse_managed_envelope(description, tag, sha, kind, name):
              if description.startswith('\ufeff') or description[:1].isspace():
                  die("managed envelope must start at byte 0")
              lines = description.split('\n')
              if len(lines) < 3 or lines[0] != '<!-- release-envelope.v2' or lines[2] != '-->':
                  die("existing Release has no managed envelope")
              env = json.loads(lines[1], object_pairs_hook=lambda pairs: _reject_duplicate_pairs(pairs, 'managed envelope'))
              if not isinstance(env, dict) or canonical_envelope(env, 'managed envelope') != lines[1]:
                  die("managed envelope is not canonical")
              published = env['published_once']
              published_text = 'true' if published else 'false'
              if env['tag'] != tag or env['kind'] != kind or env['name'] != name:
                  die(f"managed envelope identity does not match inputs (published_once={published_text})")
              if env['source_commit_sha'] != sha:
                  die(f"managed envelope source SHA does not match inputs (published_once={published_text})")
              return env


          def require_env(name):
              value = os.environ.get(name)
              if not value:
                  die(f"missing required input {name}")
              return value


          def make_body(state, publish, asset_count, notes, published_once):
              envelope = {
                  'schema': 'release-envelope.v2',
                  'state': state,
                  'published_once': published_once,
                  'kind': 'files',
                  'name': publish['name'],
                  'tag': publish['tag'],
                  'source_commit_sha': publish['sha'],
                  'request_id': publish['rid'],
                  'meta': publish['meta'],
              }
              summary = chr(10).join([
                  f"Tag: {publish['tag']}",
                  f"SHA: {publish['sha']}",
                  f"RID: {publish['rid']}",
                  f"Name: {publish['name']}",
                  "Kind: files",
                  f"Meta: {publish['meta']}",
                  f"Uploads: {asset_count}",
                  "",
              ])
              body = '<!-- release-envelope.v2' + '\n' + canonical_envelope(envelope) + '\n' + '-->' + '\n' + summary
              if notes is not None:
                  body += '\n' + '<!-- release-notes.v1 -->' + '\n' + notes
              return body


          def publish_transaction(client, project, validated):
              publish = validated.publish
              tag = publish['tag']
              sha = publish['sha']
              first_sha = client.get_tag_sha(project, tag)
              if first_sha != sha:
                  die("first tag/SHA check failed")
              exists, release = client.get_release(project, tag)
              published_once = False
              if exists:
                  env = parse_managed_envelope(release.get('description', ''), tag, sha, publish['kind'], publish['name'])
                  published_once = env['published_once']
              staging_body = make_body('staging', publish, len(validated.upload_paths), None, published_once)
              client.save_release(project, tag, staging_body, '', exists)
              for name in sorted(client.list_attachments(project, tag), key=lambda value: value.encode('ascii')):
                  client.delete_attachment(project, tag, name)
              for path in validated.upload_paths:
                  client.upload_attachment(project, tag, path)
              remote = client.list_attachments(project, tag)
              if remote != validated.upload_sizes:
                  die("remote attachment set does not match local files")
              second_sha = client.get_tag_sha(project, tag)
              if second_sha != sha:
                  die("second tag/SHA check failed")
              final_body = make_body('release', publish, len(validated.upload_paths), validated.notes, True)
              client.save_release(project, tag, final_body, 'release', True)


          def main():
              tag = require_env('PUBLISH_TAG')
              sha = require_env('PUBLISH_SHA')
              rid = require_env('PUBLISH_RID')
              bundle = Path(require_env('PUBLISH_BUNDLE'))
              validated = validate_bundle(bundle, tag, sha, rid)
              print("ok: local validation passed")
              client = SourceClient(require_env('SOURCE_API'), require_env('SOURCE_TOKEN'))
              publish_transaction(client, require_env('SOURCE_PROJECT'), validated)


