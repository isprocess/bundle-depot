name: cleanup-handoffs

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:
    inputs:
      apply:
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: cleanup-expired-handoffs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          APPLY_INPUT: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            PYBIN=python3
          elif command -v python >/dev/null 2>&1; then
            PYBIN=python
          else
            exit 1
          fi
          "$PYBIN" - <<'PY'
          """Strict handoff cleanup. Unknown matching objects fail closed and are not deleted."""

          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          CANONICAL_TEMPLATE = '{"schema":"bundle-depot-handoff.v1","project":"%s","tag":"%s","sha":"%s","rid":"%s","asset":"release-bundle.zip","size":%d,"sha256":"%s"}'
          RETENTION_SECONDS = 2 * 60 * 60
          KEYS = ["schema", "project", "tag", "sha", "rid", "asset", "size", "sha256"]
          TAG_RE = re.compile(
              r"^handoff-p(?P<project>[1-9][0-9]*)-(?P<rid>b-(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)-[0-9a-f]{12}-(?P<stamp>[0-9]{8}T[0-9]{6}Z))$"
          )
          API_ROOT = "https://api.github.com"


          def die(message):
              text = str(message)
              secret = os.environ.get("GITHUB_TOKEN") or ""
              if secret:
                  text = text.replace(secret, "[redacted]")
              sys.stderr.write(text + "\n")
              raise SystemExit(1)


          def parse_github_time(value):
              if not isinstance(value, str) or not value.endswith("Z"):
                  die("missing retention timestamp")
              try:
                  parsed = datetime.fromisoformat(value[:-1]).replace(tzinfo=timezone.utc)
              except ValueError:
                  die("missing retention timestamp")
              return parsed


          def age_anchor(release):
              if release.get("draft") is True:
                  stamp = release.get("created_at")
              else:
                  stamp = release.get("published_at")
              return parse_github_time(stamp)


          def canonical_body(fields):
              return CANONICAL_TEMPLATE % (
                  fields["project"],
                  fields["tag"],
                  fields["sha"],
                  fields["rid"],
                  fields["size"],
                  fields["sha256"],
              )


          def parse_canonical(body):
              if not isinstance(body, str):
                  return None
              try:
                  pairs = json.loads(body, object_pairs_hook=list)
              except json.JSONDecodeError:
                  return None
              if not isinstance(pairs, list):
                  return None
              keys = [key for key, _value in pairs]
              if keys != KEYS or len(set(keys)) != len(KEYS):
                  return None
              fields = {}
              for key, value in pairs:
                  fields[key] = value
              if any(not isinstance(fields[key], str) for key in ("schema", "project", "tag", "sha", "rid", "asset", "sha256")):
                  return None
              if fields["schema"] != "bundle-depot-handoff.v1" or fields["asset"] != "release-bundle.zip":
                  return None
              if isinstance(fields["size"], bool) or not isinstance(fields["size"], int) or fields["size"] <= 0:
                  return None
              if len(fields["sha256"]) != 64 or any(ch not in "0123456789abcdef" for ch in fields["sha256"]):
                  return None
              if canonical_body(fields) != body:
                  return None
              return fields


          def rid_time(tag):
              match = TAG_RE.fullmatch(tag or "")
              if not match:
                  return None
              try:
                  parsed = datetime.strptime(match.group("stamp"), "%Y%m%dT%H%M%SZ").replace(tzinfo=timezone.utc)
              except ValueError:
                  return None
              return parsed


          def looks_like_handoff(release):
              tag = str(release.get("tag_name") or "")
              title = str(release.get("name") or "")
              body = str(release.get("body") or "")
              return tag.startswith("handoff-") or title.startswith("handoff-") or "bundle-depot-handoff.v1" in body


          def is_strict_release(release):
              tag = release.get("tag_name") or ""
              match = TAG_RE.fullmatch(tag)
              fields = parse_canonical(release.get("body"))
              if match is None or fields is None or release.get("name") != tag:
                  return False
              if fields["project"] != match.group("project") or fields["rid"] != match.group("rid"):
                  return False
              assets = release.get("assets") or []
              if len(assets) != 1 or assets[0].get("name") != "release-bundle.zip":
                  return False
              if assets[0].get("size") != fields["size"]:
                  return False
              if release.get("draft") is True:
                  return True
              return release.get("prerelease") is True


          def expired(moment, now):
              return now - moment >= timedelta(seconds=RETENTION_SECONDS)


          def remove_release_then_tag(client, repo, release_id, tag, token, apply):
              if not apply:
                  sys.stdout.write("planned_release_removal %s\n" % tag)
                  sys.stdout.write("planned_tag_removal %s\n" % tag)
                  return
              release_path = "/releases/%s" % release_id
              tag_prefix = "/git/refs/tags/"
              tag_path = tag_prefix + urllib.parse.quote(tag, safe="")
              client.request("DELETE", API_ROOT + "/repos/%s%s" % (repo, release_path), token)
              client.request("DELETE", API_ROOT + "/repos/%s%s" % (repo, tag_path), token)


          def release_absent(client, repo, tag, token):
              quoted = urllib.parse.quote(tag, safe="")
              status, _headers, _payload = client.request(
                  "GET",
                  API_ROOT + "/repos/%s/releases/tags/%s" % (repo, quoted),
                  token,
              )
              if status == 404:
                  return True
              if status == 200:
                  return False
              die("unable to confirm release absence")


          def confirm_orphan(client, repo, tag, token):
              if not release_absent(client, repo, tag, token):
                  die("orphan tag has a release")
              time.sleep(60)
              if not release_absent(client, repo, tag, token):
                  die("orphan tag gained a release during recheck; not deleting")


          def consider_release(client, repo, release, token, apply, now):
              if not looks_like_handoff(release):
                  return
              if not is_strict_release(release):
                  die("unknown matching handoff object; not deleting")
              if not expired(age_anchor(release), now):
                  return
              remove_release_then_tag(client, repo, release["id"], release["tag_name"], token, apply)


          def consider_orphan(client, repo, tag, token, apply, now, known_tags):
              if tag in known_tags:
                  return
              if not tag.startswith("handoff-"):
                  return
              if TAG_RE.fullmatch(tag) is None or rid_time(tag) is None:
                  die("unknown matching handoff object; not deleting")
              if not expired(rid_time(tag), now):
                  return
              confirm_orphan(client, repo, tag, token)
              if not apply:
                  sys.stdout.write("planned_tag_removal %s\n" % tag)
                  return
              tag_prefix = "/git/refs/tags/"
              tag_path = tag_prefix + urllib.parse.quote(tag, safe="")
              client.request("DELETE", API_ROOT + "/repos/%s%s" % (repo, tag_path), token)



          class HttpClient:
              def request(self, method, url, token, data=None):
                  headers = {
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "bundle-depot-cleanup",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  body = None
                  if data is not None:
                      body = json.dumps(data).encode("utf-8")
                      headers["Content-Type"] = "application/json"

                  class NoRedirect(urllib.request.HTTPRedirectHandler):
                      def redirect_request(self, req, fp, code, msg, headers, newurl):
                          return None

                  opener = urllib.request.build_opener(NoRedirect)
                  request = urllib.request.Request(url, data=body, headers=headers, method=method)
                  try:
                      with opener.open(request, timeout=120) as response:
                          return response.status, dict(response.headers), response.read()
                  except urllib.error.HTTPError as error:
                      return error.code, dict(error.headers), error.read()
                  except urllib.error.URLError:
                      die("github request failed")


          def json_value(payload, label):
              try:
                  return json.loads(payload.decode("utf-8"))
              except (UnicodeError, json.JSONDecodeError):
                  die("%s response was not JSON" % label)


          def list_releases(client, repo, token):
              releases = []
              page = 1
              while page <= 20:
                  url = API_ROOT + "/repos/%s/releases?per_page=100&page=%d" % (repo, page)
                  status, _headers, payload = client.request("GET", url, token)
                  if status != 200:
                      die("release list failed with status %s" % status)
                  batch = json_value(payload, "release list")
                  if not isinstance(batch, list):
                      die("release list was not an array")
                  releases.extend(batch)
                  if len(batch) < 100:
                      return releases
                  page += 1
              die("release list exceeded page cap")


          def list_handoff_tags(client, repo, token):
              url = API_ROOT + "/repos/%s/git/matching-refs/tags/handoff-" % repo
              status, _headers, payload = client.request("GET", url, token)
              if status == 404:
                  return []
              if status != 200:
                  die("ref list failed with status %s" % status)
              value = json_value(payload, "ref list")
              if isinstance(value, dict):
                  value = [value]
              if not isinstance(value, list):
                  die("ref list was not an array")
              tags = []
              for item in value:
                  if not isinstance(item, dict):
                      die("ref list contained a non-object")
                  ref = str(item.get("ref") or "")
                  prefix = "refs/tags/"
                  if not ref.startswith(prefix):
                      die("ref list contained an unexpected ref")
                  tags.append(ref[len(prefix):])
              return tags


          def main():
              token = os.environ["GITHUB_TOKEN"]
              repo = os.environ["GITHUB_REPOSITORY"]
              event = os.environ.get("EVENT_NAME", "")
              if event == "schedule":
                  apply = True
              else:
                  apply = os.environ.get("APPLY_INPUT", "").lower() == "true"
              now = datetime.now(timezone.utc)
              client = HttpClient()
              releases = list_releases(client, repo, token)
              known = set()
              for release in releases:
                  if not isinstance(release, dict):
                      die("release list contained a non-object")
                  known.add(str(release.get("tag_name") or ""))
                  consider_release(client, repo, release, token, apply, now)
              for tag in list_handoff_tags(client, repo, token):
                  consider_orphan(client, repo, tag, token, apply, now, known)


          if __name__ == "__main__":
              main()
          PY
