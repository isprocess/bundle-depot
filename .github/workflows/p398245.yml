name: p398245

run-name: "${{ github.event.client_payload.rid }}"

on:
  repository_dispatch:
    types: [build_398245]

permissions: {}

concurrency:
  group: p398245
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      project: ${{ steps.project.outputs.project }}
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      rid: ${{ steps.check.outputs.rid }}
    steps:
      - name: derive-project
        id: project
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_TYPE: ${{ github.event.action }}
        run: |
          set -euo pipefail
          ref_without_revision="${WORKFLOW_REF%%@*}"
          workflow_file="${ref_without_revision##*/}"

          if [[ ! "$workflow_file" =~ ^p([1-9][0-9]*)\.yml$ ]]; then
            printf 'invalid project workflow filename: %s\n' "$workflow_file" >&2
            exit 1
          fi

          project="${BASH_REMATCH[1]}"
          if [[ "$EVENT_TYPE" != "build_$project" ]]; then
            printf 'dispatch event does not match workflow project\n' >&2
            exit 1
          fi

          printf 'project=%s\n' "$project" >> "$GITHUB_OUTPUT"
      - name: checkout-executor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/bin
          sparse-checkout-cone-mode: false
      - name: check-payload
        id: check
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          chmod +x .github/bin/bundle-tool-linux-x64.bin
          .github/bin/bundle-tool-linux-x64.bin check-payload

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout-executor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/bin
          sparse-checkout-cone-mode: false
      - name: verify-tag
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ needs.validate.outputs.project }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXEC="$GITHUB_WORKSPACE/.github/bin/bundle-tool-$TARGET"
          case "$TARGET" in
            windows-*) EXEC="$EXEC.exe" ;;
            *) EXEC="$EXEC.bin" ;;
          esac
          chmod +x "$EXEC"
          "$EXEC" verify-tag
      - name: fetch-source
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ needs.validate.outputs.project }}
          SHA: ${{ needs.validate.outputs.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXEC="$GITHUB_WORKSPACE/.github/bin/bundle-tool-$TARGET"
          case "$TARGET" in
            windows-*) EXEC="$EXEC.exe" ;;
            *) EXEC="$EXEC.bin" ;;
          esac
          chmod +x "$EXEC"
          "$EXEC" fetch-source --output "$GITHUB_WORKSPACE/src"
      - name: assert-files
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXEC="$GITHUB_WORKSPACE/.github/bin/bundle-tool-$TARGET"
          case "$TARGET" in
            windows-*) EXEC="$EXEC.exe" ;;
            *) EXEC="$EXEC.bin" ;;
          esac
          chmod +x "$EXEC"
          "$EXEC" assert-files --root src --files Cargo.toml,Cargo.lock,rust-toolchain.toml,.cargo/config.toml,src/main.rs
      - name: package-source
        if: matrix.target == 'linux-x64'
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/source.tar.gz" -C "$GITHUB_WORKSPACE" src
      - name: upload-source
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          if-no-files-found: error
      - name: toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: test
        working-directory: src
        run: |
          set -euo pipefail
          cargo test --locked
      - name: clippy
        working-directory: src
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked -- -D warnings
      - name: release-build
        working-directory: src
        run: |
          set -euo pipefail
          cargo build --release --locked
      - name: package
        working-directory: src
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          crate_name="bundle-tool"
          case "$TARGET" in
            windows-*) bin="target/release/${crate_name}.exe"; asset="bundle-tool-$TARGET.exe" ;;
            *) bin="target/release/${crate_name}"; asset="bundle-tool-$TARGET.bin" ;;
          esac
          if [ ! -s "$bin" ]; then
            printf 'built binary is missing or empty: %s\n' "$bin" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pkg-$TARGET"
          cp "$bin" "$RUNNER_TEMP/pkg-$TARGET/$asset"
      - name: upload-pkg
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pkg-${{ matrix.target }}
          path: ${{ runner.temp }}/pkg-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error

  build-arm64:
    needs: [validate, build]
    runs-on: ubuntu-24.04-arm
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: fetch-source
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: source
          path: source-artifact
      - name: unpack-source
        run: |
          set -euo pipefail
          tar -xzf source-artifact/source.tar.gz -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/src/Cargo.toml"
      - name: toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.98.1"
          components: clippy
      - name: test
        working-directory: src
        run: |
          set -euo pipefail
          cargo test --locked
      - name: clippy
        working-directory: src
        run: |
          set -euo pipefail
          cargo clippy --all-targets --locked -- -D warnings
      - name: release-build
        working-directory: src
        run: |
          set -euo pipefail
          cargo build --release --locked
      - name: package
        working-directory: src
        run: |
          set -euo pipefail
          bin="target/release/bundle-tool"
          if [ ! -s "$bin" ]; then
            printf 'built binary is missing or empty: %s\n' "$bin" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/pkg-linux-arm64"
          cp "$bin" "$RUNNER_TEMP/pkg-linux-arm64/bundle-tool-linux-arm64.bin"
          chmod +x "$RUNNER_TEMP/pkg-linux-arm64/bundle-tool-linux-arm64.bin"
          if ! file "$RUNNER_TEMP/pkg-linux-arm64/bundle-tool-linux-arm64.bin" | grep -qi 'aarch64'; then
            printf 'linux-arm64 binary is not AArch64\n' >&2
            file "$RUNNER_TEMP/pkg-linux-arm64/bundle-tool-linux-arm64.bin" >&2
            exit 1
          fi
          "$RUNNER_TEMP/pkg-linux-arm64/bundle-tool-linux-arm64.bin" --help > /dev/null
      - name: upload-pkg
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pkg-linux-arm64
          path: ${{ runner.temp }}/pkg-linux-arm64
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [validate, build, build-arm64]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: fetch-pkg-linux-x64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-linux-x64
          path: ${{ github.workspace }}/publish/bin
      - name: fetch-pkg-linux-arm64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-linux-arm64
          path: ${{ github.workspace }}/publish/bin
      - name: fetch-pkg-windows-x64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-windows-x64
          path: ${{ github.workspace }}/publish/bin
      - name: fetch-pkg-macos-x64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-x64
          path: ${{ github.workspace }}/publish/bin
      - name: fetch-pkg-macos-arm64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-arm64
          path: ${{ github.workspace }}/publish/bin
      - name: verify-uploads
        run: |
          set -euo pipefail
          for name in bundle-tool-linux-x64.bin bundle-tool-linux-arm64.bin bundle-tool-windows-x64.exe bundle-tool-macos-x64.bin bundle-tool-macos-arm64.bin; do
            if [ ! -s "$GITHUB_WORKSPACE/publish/bin/$name" ]; then
              printf 'missing or empty artifact: %s\n' "$name" >&2
              exit 1
            fi
          done
          ls -l "$GITHUB_WORKSPACE/publish/bin"
          sha256sum "$GITHUB_WORKSPACE"/publish/bin/*
      - name: update-binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          branch = os.environ["BRANCH"]
          token = os.environ["GH_TOKEN"]
          subject = "ci: update"
          api = f"https://api.github.com/repos/{repo}"
          binaries = [
              "bundle-tool-linux-x64.bin",
              "bundle-tool-linux-arm64.bin",
              "bundle-tool-windows-x64.exe",
              "bundle-tool-macos-x64.bin",
              "bundle-tool-macos-arm64.bin",
          ]

          def call(method, url, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(url, data=data, method=method)
              request.add_header("Authorization", f"Bearer {token}")
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              request.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(request, timeout=120) as resp:
                      body = resp.read()
              except urllib.error.HTTPError as error:
                  print(f"{method} {url} -> HTTP {error.code}: {error.read().decode(errors='replace')}", file=sys.stderr)
                  raise SystemExit(1)
              return json.loads(body) if body else {}

          head = call("GET", f"{api}/git/ref/heads/{branch}")["object"]["sha"]
          base_tree = call("GET", f"{api}/git/commits/{head}")["tree"]["sha"]
          print(f"head={head} base_tree={base_tree}")

          entries = []
          for name in binaries:
              path = os.path.join(os.environ["GITHUB_WORKSPACE"], "publish", "bin", name)
              blob = base64.b64encode(open(path, "rb").read()).decode()
              sha = call("POST", f"{api}/git/blobs", {"content": blob, "encoding": "base64"})["sha"]
              entries.append({"path": f".github/bin/{name}", "mode": "100644", "type": "blob", "sha": sha})
              print(f"blob {name} -> {sha}")

          tree = call("POST", f"{api}/git/trees", {"base_tree": base_tree, "tree": entries})["sha"]
          commit = call("POST", f"{api}/git/commits", {"message": subject, "tree": tree, "parents": [head]})["sha"]
          print(f"tree={tree} commit={commit}")

          current = call("GET", f"{api}/git/ref/heads/{branch}")["object"]["sha"]
          if current != head:
              print(f"branch moved during publish: {head} -> {current}", file=sys.stderr)
              raise SystemExit(1)

          call("PATCH", f"{api}/git/refs/heads/{branch}", {"sha": commit, "force": False})
          final = call("GET", f"{api}/git/ref/heads/{branch}")["object"]["sha"]
          if final != commit:
              print(f"ref update not applied: expected {commit} got {final}", file=sys.stderr)
              raise SystemExit(1)

          for name in binaries:
              path = os.path.join(os.environ["GITHUB_WORKSPACE"], "publish", "bin", name)
              digest = subprocess.run(["sha256sum", path], check=True, capture_output=True, text=True).stdout.split()[0]
              print(f"sha256 {name} = {digest}")
          print(f"published {subject}: {head} -> {commit}")
          PY
