name: p398245

on:
  repository_dispatch:
    types: [build_398245]

permissions: {}

concurrency:
  group: p398245
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      rid: ${{ steps.check.outputs.rid }}
    steps:
      - name: checkout-scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: check-payload
        id: check
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python3 .github/scripts/check-payload.py

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: checkout-scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: verify-tag
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-tag.py
      - name: fetch-source
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/fetch-source.py --output src
      - name: assert-files
        run: |
          set -euo pipefail
          python3 .github/scripts/assert-files.py --root src --files Cargo.toml,rust-toolchain.toml,release.toml,release.py,docs/usage.md,bundle-tool.lock,src/main.rs
      - name: parse-lock
        id: lock
        run: |
          set -euo pipefail
          python3 .github/scripts/parse-lock.py --lock-file src/bundle-tool.lock
      - name: bootstrap-window
        if: steps.lock.outputs.mode == 'bootstrap'
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-bootstrap-window.py --project "$SOURCE_GIT_PROJECT" --name bundle-tool --tag "$TAG" --sha "$SHA" --lock-file src/bundle-tool.lock
      - name: bootstrap-build
        if: steps.lock.outputs.mode == 'bootstrap'
        run: |
          set -euo pipefail
          cd src
          cargo build --release --locked
          OUT="$RUNNER_TEMP"/bundle-tool
          SRC=target/release/bundle-tool
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            OUT="$RUNNER_TEMP"/bundle-tool.exe
            SRC=target/release/bundle-tool.exe
          fi
          cp "$SRC" "$OUT"
          chmod +x "$OUT"
      - name: download-executor
        if: steps.lock.outputs.mode == 'release'
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP"/bundle-tool
          if [[ "$TARGET" == windows-* ]]; then
            OUT="$RUNNER_TEMP"/bundle-tool.exe
          fi
          python3 .github/scripts/download-executor.py --lock-file src/bundle-tool.lock --platform "$TARGET" --output "$OUT"
          chmod +x "$OUT"
      - name: run-plugin
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          RID: ${{ needs.validate.outputs.rid }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          EXEC="$RUNNER_TEMP"/bundle-tool
          if [[ "$TARGET" == windows-* ]]; then
            EXEC="$RUNNER_TEMP"/bundle-tool.exe
          fi
          cd src
          "$EXEC" run --source . --output "$RUNNER_TEMP"/pkg-${{ matrix.target }} --tag "$TAG" --sha "$SHA" --rid "$RID" --platform ${{ matrix.target }}
      - name: upload-pkg
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pkg-${{ matrix.target }}
          path: ${{ runner.temp }}/pkg-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: error

  prepare-bundle:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: checkout-scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: fetch-pkg-linux
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-linux-x64
          path: packages/pkg-linux-x64
      - name: fetch-pkg-windows
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-windows-x64
          path: packages/pkg-windows-x64
      - name: fetch-pkg-macos-x64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-x64
          path: packages/pkg-macos-x64
      - name: fetch-pkg-macos-arm64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-arm64
          path: packages/pkg-macos-arm64
      - name: verify-tag
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/verify-tag.py
      - name: read-lock
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/read-repo-file.py --path bundle-tool.lock --output bundle-tool.lock
      - name: parse-lock
        id: lock
        run: |
          set -euo pipefail
          python3 .github/scripts/parse-lock.py --lock-file bundle-tool.lock
      - name: bootstrap-window
        if: steps.lock.outputs.mode == 'bootstrap'
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-bootstrap-window.py --project "$SOURCE_GIT_PROJECT" --name bundle-tool --tag "$TAG" --sha "$SHA" --lock-file bundle-tool.lock
      - name: bootstrap-assemble-executor
        if: steps.lock.outputs.mode == 'bootstrap'
        run: |
          set -euo pipefail
          cp packages/pkg-linux-x64/assets/bundle-tool-linux-x64.bin "$RUNNER_TEMP"/bundle-tool
          chmod +x "$RUNNER_TEMP"/bundle-tool
      - name: download-executor
        if: steps.lock.outputs.mode == 'release'
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
        run: |
          set -euo pipefail
          python3 .github/scripts/download-executor.py --lock-file bundle-tool.lock --platform linux-x64 --output "$RUNNER_TEMP"/bundle-tool
          chmod +x "$RUNNER_TEMP"/bundle-tool
      - name: assemble
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          RID: ${{ needs.validate.outputs.rid }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP"/bundle-tool assemble --input packages --output "$GITHUB_WORKSPACE"/release-bundle --tag "$TAG" --sha "$SHA" --rid "$RID"
      - name: upload-bundle
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [validate, prepare-bundle]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      sha: ${{ needs.validate.outputs.sha }}
      rid: ${{ needs.validate.outputs.rid }}
    secrets:
      api: ${{ secrets.SOURCE_GIT_API }}
      project: ${{ secrets.SOURCE_GIT_PROJECT_398245 }}
      token: ${{ secrets.SOURCE_GIT_TOKEN }}
