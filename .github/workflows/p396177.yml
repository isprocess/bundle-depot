name: p396177

on:
  repository_dispatch:
    types: [build_396177]

permissions: {}

concurrency:
  group: p396177-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions: {}
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      sha: ${{ steps.check.outputs.sha }}
      rid: ${{ steps.check.outputs.rid }}
    steps:
      - name: check-payload
        id: check
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, re, sys

          def fail(msg):
              print(f"error: {msg}", file=sys.stderr)
              sys.exit(1)

          try:
              payload = json.loads(os.environ.get("PAYLOAD", "{}"))
          except Exception as e:
              fail(f"payload is not valid JSON: {e}")

          if not isinstance(payload, dict) or set(payload.keys()) != {"tag", "sha", "rid"}:
              fail(f"payload must contain exactly tag, sha and rid: {payload!r}")

          tag = payload["tag"]
          sha = payload["sha"]
          rid = payload["rid"]

          if not isinstance(tag, str) or not re.match(r'^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$', tag):
              fail(f"tag format is not allowed: {tag!r}")
          if not isinstance(sha, str) or not re.match(r'^[0-9a-f]{40}$', sha):
              fail(f"sha format is not allowed: {sha!r}")
          if not isinstance(rid, str) or not re.match(r'^b-[0-9.]+-[0-9a-f]{12}-[0-9]{8}T[0-9]{6}Z$', rid):
              fail(f"rid format is not allowed: {rid!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"tag={tag}\n")
              f.write(f"sha={sha}\n")
              f.write(f"rid={rid}\n")

          print(f"tag={tag} sha={sha} rid={rid}")
          PY

  fetch:
    needs: validate
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: checkout-scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: verify-tag
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_396177 }}
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          tag = os.environ["TAG"]
          expected = os.environ["SHA"]
          url = (f"{os.environ['SOURCE_GIT_API'].rstrip('/')}/projects/"
                 f"{os.environ['SOURCE_GIT_PROJECT']}/repository/tags/"
                 f"{urllib.parse.quote(tag, safe='')}")
          request = urllib.request.Request(url)
          request.add_header("PRIVATE-TOKEN", os.environ["SOURCE_GIT_TOKEN"])
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.loads(response.read())
          except urllib.error.HTTPError as e:
              print(f"error: tag lookup failed: HTTP {e.code}", file=sys.stderr)
              sys.exit(1)
          actual = (data.get("commit") or {}).get("id")
          if actual != expected:
              print(f"error: tag SHA mismatch: {actual} != {expected}", file=sys.stderr)
              sys.exit(1)
          print(f"tag {tag} points at {actual}")
          PY

      - name: fetch-source
        env:
          SOURCE_GIT_TOKEN: ${{ secrets.SOURCE_GIT_TOKEN }}
          SOURCE_GIT_API: ${{ secrets.SOURCE_GIT_API }}
          SOURCE_GIT_PROJECT: ${{ secrets.SOURCE_GIT_PROJECT_396177 }}
          SHA: ${{ needs.validate.outputs.sha }}
        run: |
          set -euo pipefail

          curl -fsSL -H "PRIVATE-TOKEN: ${SOURCE_GIT_TOKEN}" \
            "${SOURCE_GIT_API}/projects/${SOURCE_GIT_PROJECT}/repository/archive?sha=${SHA}" \
            -o src.zip

          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("src.zip")
          if archive.stat().st_size < 1000:
              raise SystemExit("error: archive is too small")
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              if not names or any(n.startswith("/") or ".." in Path(n).parts for n in names):
                  raise SystemExit("error: archive contains unsafe entry names")
              z.extractall("src")
          archive.unlink()
          print("ok: source extracted")
          PY

      - name: assert-files
        run: |
          set -euo pipefail

          python3 .github/scripts/assert-files.py \
            --root src \
            --files README.md,AGENTS.md,Cargo.toml,rust-toolchain.toml,docs/git-tool.md,docs/bundle-tool.md,tools/git-tool/release.toml,tools/git-tool/release.py,tools/bundle-tool/release.toml,tools/bundle-tool/release.py \
            --globs git-tool/Cargo.toml,bundle-tool/Cargo.toml

      - name: upload-src
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: src-${{ needs.validate.outputs.sha }}
          path: src/
          retention-days: 1

  build:
    needs: [validate, fetch]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
          - target: windows-x64
            os: windows-2022
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: download-src
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: src-${{ needs.validate.outputs.sha }}
          path: src/

      - name: build-packages
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          RID: ${{ needs.validate.outputs.rid }}
        run: |
          set -euo pipefail

          cd src
          cargo build --release --locked -p bundle-tool
          BT=./bt-runner
          if [[ "${{ matrix.target }}" == windows-* ]]; then BT=./bt-runner.exe; fi
          SRC_BT=./target/release/bundle-tool
          if [[ "${{ matrix.target }}" == windows-* ]]; then SRC_BT=./target/release/bundle-tool.exe; fi
          cp "$SRC_BT" "$BT"

          "$BT" run --source tools/bundle-tool \
            --output pkg-out/pkg-bundle-tool-${{ matrix.target }} \
            --tag "$TAG" --sha "$SHA" --rid "$RID"
          "$BT" run --source tools/git-tool \
            --output pkg-out/pkg-git-tool-${{ matrix.target }} \
            --tag "$TAG" --sha "$SHA" --rid "$RID"

          ls -R pkg-out

      - name: upload-pkg
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: pkg-${{ matrix.target }}
          path: src/pkg-out/
          retention-days: 1
          if-no-files-found: error

  prepare-bundle:
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - name: download-src
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: src-${{ needs.validate.outputs.sha }}
          path: src/

      - name: download-pkgs
        run: |
          set -euo pipefail
          for target in linux-x64 windows-x64 macos-x64 macos-arm64; do
            mkdir -p "artifacts/pkg-$target"
          done

      - name: fetch-pkg-linux
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-linux-x64
          path: artifacts/pkg-linux-x64
      - name: fetch-pkg-windows
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-windows-x64
          path: artifacts/pkg-windows-x64
      - name: fetch-pkg-macos-x64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-x64
          path: artifacts/pkg-macos-x64
      - name: fetch-pkg-macos-arm64
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: pkg-macos-arm64
          path: artifacts/pkg-macos-arm64

      - name: stage-packages
        run: |
          set -euo pipefail

          mkdir -p packages usage
          for target in linux-x64 windows-x64 macos-x64 macos-arm64; do
            mv "artifacts/pkg-$target/pkg-git-tool-$target" "packages/"
            mv "artifacts/pkg-$target/pkg-bundle-tool-$target" "packages/"
          done
          cp src/docs/git-tool.md usage/git-tool-usage.md
          cp src/docs/bundle-tool.md usage/bundle-tool-usage.md
          ls packages
          ls usage

      - name: assemble
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          SHA: ${{ needs.validate.outputs.sha }}
          RID: ${{ needs.validate.outputs.rid }}
        run: |
          set -euo pipefail

          cd src
          cargo build --release --locked -p bundle-tool
          ./target/release/bundle-tool assemble \
            --input ../packages \
            --usage-dir ../usage \
            --output ../release-bundle \
            --tag "$TAG" --sha "$SHA" --rid "$RID"

          ls -R ../release-bundle

      - name: upload-bundle
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: release-bundle
          path: release-bundle/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [validate, prepare-bundle]
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      sha: ${{ needs.validate.outputs.sha }}
      rid: ${{ needs.validate.outputs.rid }}
    secrets:
      api: ${{ secrets.SOURCE_GIT_API }}
      project: ${{ secrets.SOURCE_GIT_PROJECT_396177 }}
      token: ${{ secrets.SOURCE_GIT_TOKEN }}
