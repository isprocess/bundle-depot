name: ai-studio-deepseek-runner

run-name: "ai-studio-deepseek-${{ github.event.client_payload.batch_id || github.event.client_payload.probe_id || github.run_id }}"

on:
  repository_dispatch:
    types:
      - ai_studio_deepseek_batch_v1
      - ai_studio.runner_health_probe.v1
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-studio-text-${{ github.event.client_payload.batch_id || github.event.client_payload.probe_id || github.run_id }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'ai_studio_deepseek_batch_v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      jobs: ${{ steps.parse.outputs.jobs }}
    steps:
      - name: validate-batch-payload
        id: parse
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          // 失败只输出固定类别，避免 client payload 进入 Actions 日志。
          function fail(category) {
            process.stderr.write(`${category}\n`);
            process.exit(1);
          }

          function isOpaqueId(value) {
            return (
              typeof value === "string"
              && value.length > 0
              && value.length <= 256
              && !/[\u0000-\u001f\u007f]/u.test(value)
            );
          }

          let payload;
          try {
            payload = JSON.parse(process.env.PAYLOAD ?? "");
          } catch {
            fail("invalid payload json");
          }
          if (
            payload === null
            || typeof payload !== "object"
            || Array.isArray(payload)
          ) {
            fail("invalid payload shape");
          }

          const expectedKeys = [
            "batch_id",
            "expected_workflow_sha",
            "jobs",
            "runner_release",
            "schema",
          ];
          const actualKeys = Object.keys(payload).sort();
          if (
            actualKeys.length !== expectedKeys.length
            || actualKeys.some((key, index) => key !== expectedKeys[index])
          ) {
            fail("invalid payload shape");
          }
          if (payload.schema !== "ai_studio.deepseek_dispatch_batch.v1") {
            fail("invalid payload schema");
          }
          if (!isOpaqueId(payload.batch_id) || !isOpaqueId(payload.runner_release)) {
            fail("invalid payload value");
          }
          if (
            typeof payload.expected_workflow_sha !== "string"
            || !/^[a-f0-9]{40}$/u.test(payload.expected_workflow_sha)
          ) {
            fail("invalid workflow sha");
          }
          if (
            !Array.isArray(payload.jobs)
            || payload.jobs.length < 1
            || payload.jobs.length > 20
          ) {
            fail("invalid jobs length");
          }

          const seenJobIds = new Set();
          const seenNonces = new Set();
          const normalized = [];
          for (const item of payload.jobs) {
            if (
              item === null
              || typeof item !== "object"
              || Array.isArray(item)
            ) {
              fail("invalid job shape");
            }
            const itemKeys = Object.keys(item).sort();
            if (
              itemKeys.length !== 2
              || itemKeys[0] !== "dispatch_nonce"
              || itemKeys[1] !== "job_id"
            ) {
              fail("invalid job shape");
            }
            if (!isOpaqueId(item.job_id) || !isOpaqueId(item.dispatch_nonce)) {
              fail("invalid job value");
            }
            if (seenJobIds.has(item.job_id) || seenNonces.has(item.dispatch_nonce)) {
              fail("duplicate job identity");
            }
            seenJobIds.add(item.job_id);
            seenNonces.add(item.dispatch_nonce);
            normalized.push({
              leg_index: normalized.length + 1,
              job_id: item.job_id,
              dispatch_nonce: item.dispatch_nonce,
            });
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `jobs=${JSON.stringify(normalized)}\n`,
            "utf8",
          );
          NODE

  execute:
    name: "ai-studio-deepseek-leg-${{ matrix.item.leg_index }}"
    if: github.event_name == 'repository_dispatch' && github.event.action == 'ai_studio_deepseek_batch_v1'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        item: ${{ fromJSON(needs.validate.outputs.jobs) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout-runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/runner
          sparse-checkout-cone-mode: false
      - name: validate-runner
        id: validate
        env:
          RUNNER_RELEASE: ${{ github.event.client_payload.runner_release }}
          EXPECTED_WORKFLOW_SHA: ${{ github.event.client_payload.expected_workflow_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          function fail(category) {
            process.stderr.write(`${category}\n`);
            process.exit(1);
          }

          const runnerRoot = path.resolve(".github/runner");
          let manifest;
          try {
            manifest = JSON.parse(
              fs.readFileSync(path.join(runnerRoot, "deepseek-runner-manifest.json"), "utf8"),
            );
          } catch {
            fail("invalid runner manifest");
          }
          if (manifest.schema !== "deepseek-runner.manifest.v1") {
            fail("invalid runner manifest schema");
          }
          if (manifest.target !== "x86_64-unknown-linux-musl") {
            fail("invalid runner target");
          }
          if (process.env.RUNNER_RELEASE !== manifest.runner_release) {
            fail("runner release mismatch");
          }
          const binaryName = manifest?.binary?.name;
          if (
            typeof binaryName !== "string"
            || binaryName.length > 128
            || !/^deepseek-runner-[A-Za-z0-9._-]+$/u.test(binaryName)
            || path.basename(binaryName) !== binaryName
          ) {
            fail("invalid runner binary name");
          }
          const binaryPath = path.join(runnerRoot, binaryName);
          let digest;
          try {
            digest = crypto
              .createHash("sha256")
              .update(fs.readFileSync(binaryPath))
              .digest("hex");
          } catch {
            fail("runner binary unavailable");
          }
          if (digest !== manifest?.binary?.sha256) {
            fail("runner digest mismatch");
          }
          if (process.env.EXPECTED_WORKFLOW_SHA !== process.env.GITHUB_SHA) {
            fail("workflow sha mismatch");
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `binary=${binaryName}\n`,
            "utf8",
          );
          NODE
      - name: execute-runner
        env:
          API_BASE_URL: ${{ secrets.AI_STUDIO_RUNNER_API_BASE_URL }}
          JOB_ID: ${{ matrix.item.job_id }}
          DISPATCH_NONCE: ${{ matrix.item.dispatch_nonce }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          RUNNER_BINARY: ${{ steps.validate.outputs.binary }}
        run: |
          set -euo pipefail
          runner_path=".github/runner/${RUNNER_BINARY}"
          chmod +x "$runner_path"
          "$runner_path" run

  probe:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'ai_studio.runner_health_probe.v1'
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout-runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/runner
          sparse-checkout-cone-mode: false
      - name: validate-probe-payload
        id: validate
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          function fail(category) {
            process.stderr.write(`${category}\n`);
            process.exit(1);
          }

          function isOpaqueId(value) {
            return (
              typeof value === "string"
              && value.length > 0
              && value.length <= 256
              && !/[\u0000-\u001f\u007f]/u.test(value)
            );
          }

          let payload;
          try {
            payload = JSON.parse(process.env.PAYLOAD ?? "");
          } catch {
            fail("invalid probe payload json");
          }
          if (
            payload === null
            || typeof payload !== "object"
            || Array.isArray(payload)
          ) {
            fail("invalid probe payload shape");
          }
          const expectedKeys = ["dispatch_nonce", "probe_id", "schema"];
          const actualKeys = Object.keys(payload).sort();
          if (
            actualKeys.length !== expectedKeys.length
            || actualKeys.some((key, index) => key !== expectedKeys[index])
          ) {
            fail("invalid probe payload shape");
          }
          if (payload.schema !== "ai_studio.runner_health_probe.v1") {
            fail("invalid probe payload schema");
          }
          if (!isOpaqueId(payload.probe_id) || !isOpaqueId(payload.dispatch_nonce)) {
            fail("invalid probe payload value");
          }

          const runnerRoot = path.resolve(".github/runner");
          let manifest;
          try {
            manifest = JSON.parse(
              fs.readFileSync(path.join(runnerRoot, "deepseek-runner-manifest.json"), "utf8"),
            );
          } catch {
            fail("invalid runner manifest");
          }
          if (manifest.schema !== "deepseek-runner.manifest.v1") {
            fail("invalid runner manifest schema");
          }
          if (manifest.target !== "x86_64-unknown-linux-musl") {
            fail("invalid runner target");
          }
          const binaryName = manifest?.binary?.name;
          if (
            typeof binaryName !== "string"
            || binaryName.length > 128
            || !/^deepseek-runner-[A-Za-z0-9._-]+$/u.test(binaryName)
            || path.basename(binaryName) !== binaryName
          ) {
            fail("invalid runner binary name");
          }
          let digest;
          try {
            digest = require("node:crypto")
              .createHash("sha256")
              .update(fs.readFileSync(path.join(runnerRoot, binaryName)))
              .digest("hex");
          } catch {
            fail("runner binary unavailable");
          }
          if (digest !== manifest?.binary?.sha256) {
            fail("runner digest mismatch");
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `binary=${binaryName}\n`,
            "utf8",
          );
          NODE
      - name: execute-probe
        env:
          API_BASE_URL: ${{ secrets.AI_STUDIO_RUNNER_API_BASE_URL }}
          RUNNER_PROBE_ID: ${{ github.event.client_payload.probe_id }}
          RUNNER_PROBE_NONCE: ${{ github.event.client_payload.dispatch_nonce }}
          RUNNER_BINARY: ${{ steps.validate.outputs.binary }}
        run: |
          set -euo pipefail
          runner_path=".github/runner/${RUNNER_BINARY}"
          chmod +x "$runner_path"
          "$runner_path" probe

  tick:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: dispatch-tick
        env:
          GATEWAY_URL: ${{ secrets.AI_STUDIO_TEXT_DISPATCH_TICK_URL }}
          TEXT_DISPATCH_TICK_TOKEN: ${{ secrets.TEXT_DISPATCH_TICK_TOKEN }}
        run: |
          set -euo pipefail
          idempotency_key="github-schedule-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response_file="$RUNNER_TEMP/dispatch-tick.json"
          status="$(curl --silent --show-error \
            --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $TEXT_DISPATCH_TICK_TOKEN" \
            --header "Idempotency-Key: $idempotency_key" \
            --output "$response_file" \
            --write-out '%{http_code}' \
            "$GATEWAY_URL")"
          cat "$response_file"
          printf '\n'
          test "$status" = "200"
