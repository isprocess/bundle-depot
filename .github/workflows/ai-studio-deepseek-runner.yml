name: ai-studio-deepseek-runner

run-name: "ai-studio-deepseek-${{ github.event.client_payload.job_id }}"

on:
  repository_dispatch:
    types: [ai_studio_deepseek_job_v1]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ai-studio-deepseek-runner
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout-runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: .github/runner
          sparse-checkout-cone-mode: false
      - name: validate-payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["PAYLOAD"])
          expected = {"schema", "job_id", "runner_release", "dispatch_nonce"}
          if not isinstance(payload, dict) or set(payload) != expected:
              raise SystemExit("invalid payload shape")
          if payload["schema"] != "ai_studio.deepseek_dispatch.v1":
              raise SystemExit("invalid payload schema")
          for key in ("job_id", "runner_release", "dispatch_nonce"):
              value = payload[key]
              if not isinstance(value, str) or not value or len(value) > 256:
                  raise SystemExit("invalid payload value")
              if any(ord(char) < 32 or ord(char) == 127 for char in value):
                  raise SystemExit("invalid payload control")

          root = Path(".github/runner")
          manifest = json.loads((root / "deepseek-runner-manifest.json").read_text())
          binary = root / manifest["binary"]["name"]
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          if manifest["schema"] != "deepseek-runner.manifest.v1":
              raise SystemExit("invalid runner manifest schema")
          if manifest["target"] != "x86_64-unknown-linux-musl":
              raise SystemExit("invalid runner target")
          if payload["runner_release"] != manifest["runner_release"]:
              raise SystemExit("runner release mismatch")
          if digest != manifest["binary"]["sha256"]:
              raise SystemExit("runner digest mismatch")
          PY
      - name: execute-runner
        env:
          API_BASE_URL: "https://ai.yingkg.com/v1"
          JOB_ID: ${{ github.event.client_payload.job_id }}
          DISPATCH_NONCE: ${{ github.event.client_payload.dispatch_nonce }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x .github/runner/deepseek-runner-linux-x64-musl.bin
          .github/runner/deepseek-runner-linux-x64-musl.bin run

  tick:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: dispatch-tick
        env:
          GATEWAY_URL: "https://ai.yingkg.com/v1/internal/text-dispatch-tick"
          TEXT_DISPATCH_TICK_TOKEN: ${{ secrets.TEXT_DISPATCH_TICK_TOKEN }}
        run: |
          set -euo pipefail
          idempotency_key="github-schedule-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response="$(curl --silent --show-error --fail-with-body \
            --max-time 20 \
            --request POST \
            --header "Authorization: Bearer $TEXT_DISPATCH_TICK_TOKEN" \
            --header "Idempotency-Key: $idempotency_key" \
            "$GATEWAY_URL")"
          printf '%s\n' "$response"
